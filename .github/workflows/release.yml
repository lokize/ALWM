name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify VERSION bumped for code changes
        if: github.event_name == 'push'
        run: bash scripts/verify-version-bump.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Verify release version is new
        run: bash scripts/verify-release-ready.sh

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Read version
        id: meta
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Build release app
        env:
          ALWM_CONFIG: release
          ALWM_FAST_RELEASE: "1"
          ALWM_RELAUNCH: "0"
          ALWM_DIST_ONLY: "1"
          ALWM_SIGN_IDENTITY: "-"
        run: |
          set -euxo pipefail
          bash scripts/package.sh
          bash scripts/create-dmg.sh
          ls -la dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euxo pipefail
          DMG="dist/ALWM-${VERSION}.dmg"
          test -f "$DMG"
          NOTES_FILE="$(mktemp)"
          bash scripts/release-notes.sh > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — refreshing DMG and notes"
            gh release upload "$TAG" "$DMG" --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$DMG" \
              --title "ALWM ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

          echo "Published https://github.com/${{ github.repository }}/releases/tag/${TAG}"
